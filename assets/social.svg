<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="pi-codebuddy-oauth social card">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d0d12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="80" y="70" rx="8" width="260" height="50" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="210" y="104" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#c4b5fd">pi-extension</text>
  <text x="1120" y="104" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">pi.dev/packages</text>

  <text x="600" y="290" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="72" font-weight="700" fill="#ffffff">pi-codebuddy-oauth</text>
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" fill="#c9c9d4">CodeBuddy (IOA) provider for pi &#183; OAuth + API key</text>

  <rect x="170" y="420" rx="14" width="860" height="80" fill="#16161d" stroke="url(#accent)" stroke-width="3"/>
  <text x="600" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#a78bfa">$ pi install npm:@tychenjiajun/pi-codebuddy-oauth</text>

  <rect x="170" y="560" width="860" height="8" rx="4" fill="url(#accent)"/>
</svg>
